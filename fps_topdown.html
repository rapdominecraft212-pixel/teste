<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Top-Down - Floresta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #1a472a;
            font-family: 'Arial', sans-serif;
            cursor: crosshair;
        }

        #gameCanvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }

        #ui {
            position: fixed;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            pointer-events: none;
        }

        #healthBar {
            width: 200px;
            height: 25px;
            background: rgba(0,0,0,0.6);
            border: 2px solid #333;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 10px;
        }

        #healthFill {
            height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff6666);
            width: 100%;
            transition: width 0.3s;
        }

        #waveInfo {
            margin-top: 10px;
            font-size: 20px;
            font-weight: bold;
        }

        #menu {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #menu h1 {
            color: #ff6666;
            font-size: 60px;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(255,102,102,0.5);
        }

        .menuBtn {
            background: linear-gradient(135deg, #2a5a3a, #1a472a);
            color: white;
            border: 2px solid #4a8a5a;
            padding: 15px 60px;
            margin: 15px;
            font-size: 24px;
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.3s;
            min-width: 250px;
        }

        .menuBtn:hover {
            background: linear-gradient(135deg, #3a7a5a, #2a5a3a);
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(74,138,90,0.5);
        }

        #controls {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
            z-index: 100;
            pointer-events: none;
        }

        .damage-flash {
            animation: damageFlash 0.3s;
        }

        @keyframes damageFlash {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(2); }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div>VIDA</div>
        <div id="healthBar">
            <div id="healthFill"></div>
        </div>
        <div id="waveInfo">Horda: <span id="waveNum">1</span></div>
        <div>Inimigos: <span id="enemyCount">0</span></div>
    </div>

    <div id="controls">
        WASD - Mover | Mouse - Mirar | Clique Esq - Atirar | Clique Dir - Granada | ESPAÇO - Menu
    </div>

    <div id="menu">
        <h1>PAUSE</h1>
        <button class="menuBtn" onclick="resumeGame()">VOLTAR</button>
        <button class="menuBtn" onclick="restartGame()">REINICIAR</button>
        <button class="menuBtn" onclick="exitGame()">SAIR</button>
    </div>

    <script>
        // Configuração do Canvas
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Estado do Jogo
        let gameRunning = true;
        let wave = 1;
        let enemiesRemaining = 0;
        let totalEnemiesInWave = 0;

        // Jogador
        const player = {
            x: 0,
            y: 0,
            radius: 20,
            speed: 5,
            health: 100,
            maxHealth: 100,
            angle: 0,
            weaponLength: 40
        };

        // Arrays de entidades
        let bullets = [];
        let grenades = [];
        let explosions = [];
        let enemies = [];
        let medkits = [];
        let trees = [];
        let particles = [];

        // Input
        const keys = {};
        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        // Gerar árvores aleatórias no mapa
        function generateTrees() {
            trees = [];
            for (let i = 0; i < 150; i++) {
                trees.push({
                    x: (Math.random() - 0.5) * 3000,
                    y: (Math.random() - 0.5) * 3000,
                    radius: 25 + Math.random() * 35,
                    shadowOffset: 15 + Math.random() * 10
                });
            }
        }

        // Inicializar jogo
        function initGame() {
            player.x = 0;
            player.y = 0;
            player.health = player.maxHealth;
            player.angle = 0;
            
            bullets = [];
            grenades = [];
            explosions = [];
            enemies = [];
            medkits = [];
            particles = [];
            
            wave = 1;
            startWave();
            generateTrees();
            updateUI();
        }

        // Iniciar horda
        function startWave() {
            if (wave === 1) {
                totalEnemiesInWave = 2;
            } else {
                totalEnemiesInWave = Math.ceil(totalEnemiesInWave * 1.5);
            }
            enemiesRemaining = totalEnemiesInWave;
            
            // Spawnar inimigos fora da tela
            spawnEnemies(totalEnemiesInWave);
            updateUI();
        }

        // Spawnar inimigos
        function spawnEnemies(count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 600 + Math.random() * 400; // Fora do campo de visão
                
                enemies.push({
                    x: player.x + Math.cos(angle) * distance,
                    y: player.y + Math.sin(angle) * distance,
                    radius: 18,
                    speed: 2 + Math.random() * 1.5,
                    health: 30,
                    maxHealth: 30,
                    shootCooldown: 0,
                    shootInterval: 60 + Math.random() * 60
                });
            }
        }

        // Atualizar UI
        function updateUI() {
            document.getElementById('healthFill').style.width = 
                (player.health / player.maxHealth * 100) + '%';
            document.getElementById('waveNum').textContent = wave;
            document.getElementById('enemyCount').textContent = enemiesRemaining;
        }

        // Sistema de partículas
        function createParticles(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 10,
                    vy: (Math.random() - 0.5) * 10,
                    life: 30 + Math.random() * 20,
                    color: color,
                    size: 3 + Math.random() * 4
                });
            }
        }

        // Atirar
        function shoot() {
            const bulletSpeed = 15;
            bullets.push({
                x: player.x + Math.cos(player.angle) * player.weaponLength,
                y: player.y + Math.sin(player.angle) * player.weaponLength,
                vx: Math.cos(player.angle) * bulletSpeed,
                vy: Math.sin(player.angle) * bulletSpeed,
                damage: 15,
                life: 100
            });
            
            // Efeito de tiro
            createParticles(
                player.x + Math.cos(player.angle) * player.weaponLength,
                player.y + Math.sin(player.angle) * player.weaponLength,
                '#ffff00',
                5
            );
        }

        // Jogar granada
        function throwGrenade() {
            // Adicionar incerteza no alvo
            const uncertainty = 50;
            const targetX = mouse.x + (Math.random() - 0.5) * uncertainty * 2;
            const targetY = mouse.y + (Math.random() - 0.5) * uncertainty * 2;
            
            const angle = Math.atan2(targetY - canvas.height/2, targetX - canvas.width/2);
            const speed = 12;
            
            grenades.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                targetX: player.x + (targetX - canvas.width/2),
                targetY: player.y + (targetY - canvas.height/2),
                life: 40,
                fuse: 40
            });
        }

        // Explosão
        function explode(x, y, radius) {
            explosions.push({
                x: x,
                y: y,
                radius: 0,
                maxRadius: radius,
                life: 20
            });
            
            createParticles(x, y, '#ff6600', 20);
            createParticles(x, y, '#ffff00', 15);
            
            // Dano em área
            // Verificar jogadores
            const distToPlayer = Math.hypot(player.x - x, player.y - y);
            if (distToPlayer < radius) {
                const damage = Math.floor(50 * (1 - distToPlayer / radius));
                player.health -= damage;
                updateUI();
            }
            
            // Verificar inimigos
            enemies.forEach((enemy, index) => {
                const dist = Math.hypot(enemy.x - x, enemy.y - y);
                if (dist < radius) {
                    const damage = Math.floor(50 * (1 - dist / radius));
                    enemy.health -= damage;
                    if (enemy.health <= 0) {
                        createMedkit(enemy.x, enemy.y);
                        createParticles(enemy.x, enemy.y, '#ff0000', 10);
                        enemies.splice(index, 1);
                        enemiesRemaining--;
                        updateUI();
                        
                        if (enemiesRemaining <= 0) {
                            wave++;
                            setTimeout(startWave, 2000);
                        }
                    }
                }
            });
        }

        // Criar kit médico
        function createMedkit(x, y) {
            medkits.push({
                x: x,
                y: y,
                width: 25,
                height: 15,
                life: 600 // Dura 10 segundos
            });
        }

        // Coletar kit médico
        function collectMedkit(index) {
            player.health = Math.min(player.health + 30, player.maxHealth);
            medkits.splice(index, 1);
            updateUI();
        }

        // IA do inimigo
        function updateEnemyAI(enemy) {
            // Calcular ângulo para o jogador
            const angleToPlayer = Math.atan2(player.y - enemy.y, player.x - enemy.x);
            const distToPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
            
            // Verificar se está fora do campo de visão do jogador (emboscada)
            const angleDiff = Math.abs(angleToPlayer - player.angle);
            const normalizedAngleDiff = Math.min(angleDiff, Math.PI * 2 - angleDiff);
            const isBehind = normalizedAngleDiff > Math.PI / 2;
            
            // Mover-se estrategicamente
            let moveAngle = angleToPlayer;
            
            if (isBehind && distToPlayer > 200) {
                // Se está atrás, aproxima-se
                moveAngle = angleToPlayer;
            } else if (!isBehind && distToPlayer > 300) {
                // Se está na frente, tenta flanquear
                moveAngle = angleToPlayer + Math.PI / 3 * (Math.random() > 0.5 ? 1 : -1);
            }
            
            // Mover inimigo
            if (distToPlayer > 150) {
                enemy.x += Math.cos(moveAngle) * enemy.speed;
                enemy.y += Math.sin(moveAngle) * enemy.speed;
            }
            
            // Atirar no jogador
            enemy.shootCooldown--;
            if (enemy.shootCooldown <= 0 && distToPlayer < 500) {
                // Adicionar imprecisão ao tiro do inimigo
                const inaccuracy = 0.1;
                const shootAngle = angleToPlayer + (Math.random() - 0.5) * inaccuracy;
                
                bullets.push({
                    x: enemy.x,
                    y: enemy.y,
                    vx: Math.cos(shootAngle) * 10,
                    vy: Math.sin(shootAngle) * 10,
                    damage: 10,
                    life: 80,
                    isEnemy: true
                });
                
                enemy.shootCooldown = enemy.shootInterval;
            }
        }

        // Detectar colisão com árvores
        function checkTreeCollision(x, y, radius) {
            for (let tree of trees) {
                const dist = Math.hypot(tree.x - x, tree.y - y);
                if (dist < tree.radius + radius) {
                    return true;
                }
            }
            return false;
        }

        // Update
        function update() {
            if (!gameRunning) return;
            
            // Movimento do jogador
            let dx = 0, dy = 0;
            if (keys['w'] || keys['W']) dy -= 1;
            if (keys['s'] || keys['S']) dy += 1;
            if (keys['a'] || keys['A']) dx -= 1;
            if (keys['d'] || keys['D']) dx += 1;
            
            if (dx !== 0 || dy !== 0) {
                const length = Math.hypot(dx, dy);
                dx /= length;
                dy /= length;
                
                const newX = player.x + dx * player.speed;
                const newY = player.y + dy * player.speed;
                
                if (!checkTreeCollision(newX, player.y, player.radius)) {
                    player.x = newX;
                }
                if (!checkTreeCollision(player.x, newY, player.radius)) {
                    player.y = newY;
                }
            }
            
            // Rotação do jogador para o mouse
            player.angle = Math.atan2(mouse.y - canvas.height/2, mouse.x - canvas.width/2);
            
            // Atualizar balas
            bullets.forEach((bullet, index) => {
                bullet.x += bullet.vx;
                bullet.y += bullet.vy;
                bullet.life--;
                
                // Colisão com árvores
                if (checkTreeCollision(bullet.x, bullet.y, 3)) {
                    createParticles(bullet.x, bullet.y, '#8b4513', 3);
                    bullets.splice(index, 1);
                    return;
                }
                
                // Colisão com entidades
                if (bullet.isEnemy) {
                    // Bala inimiga atingindo jogador
                    const dist = Math.hypot(player.x - bullet.x, player.y - bullet.y);
                    if (dist < player.radius) {
                        player.health -= bullet.damage;
                        updateUI();
                        bullets.splice(index, 1);
                        createParticles(bullet.x, bullet.y, '#ff0000', 5);
                    }
                } else {
                    // Bala do jogador atingindo inimigo
                    enemies.forEach((enemy, eIndex) => {
                        const dist = Math.hypot(enemy.x - bullet.x, enemy.y - bullet.y);
                        if (dist < enemy.radius) {
                            enemy.health -= bullet.damage;
                            createParticles(bullet.x, bullet.y, '#ff0000', 5);
                            
                            if (enemy.health <= 0) {
                                createMedkit(enemy.x, enemy.y);
                                createParticles(enemy.x, enemy.y, '#ff0000', 10);
                                enemies.splice(eIndex, 1);
                                enemiesRemaining--;
                                updateUI();
                                
                                if (enemiesRemaining <= 0) {
                                    wave++;
                                    setTimeout(startWave, 2000);
                                }
                            }
                            
                            bullets.splice(index, 1);
                        }
                    });
                }
                
                if (bullet.life <= 0) {
                    bullets.splice(index, 1);
                }
            });
            
            // Atualizar granadas
            grenades.forEach((grenade, index) => {
                grenade.x += grenade.vx;
                grenade.y += grenade.vy;
                grenade.life--;
                
                if (grenade.life <= 0) {
                    explode(grenade.x, grenade.y, 100);
                    grenades.splice(index, 1);
                }
            });
            
            // Atualizar explosões
            explosions.forEach((explosion, index) => {
                explosion.radius += explosion.maxRadius / explosion.life;
                explosion.life--;
                if (explosion.life <= 0) {
                    explosions.splice(index, 1);
                }
            });
            
            // Atualizar inimigos
            enemies.forEach(enemy => {
                updateEnemyAI(enemy);
            });
            
            // Atualizar kits médicos
            medkits.forEach((medkit, index) => {
                medkit.life--;
                
                // Colisão com jogador
                const dist = Math.hypot(player.x - medkit.x, player.y - medkit.y);
                if (dist < player.radius + medkit.width/2) {
                    collectMedkit(index);
                }
                
                if (medkit.life <= 0) {
                    medkits.splice(index, 1);
                }
            });
            
            // Atualizar partículas
            particles.forEach((particle, index) => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vx *= 0.95;
                particle.vy *= 0.95;
                particle.life--;
                if (particle.life <= 0) {
                    particles.splice(index, 1);
                }
            });
            
            // Verificar morte do jogador
            if (player.health <= 0) {
                gameOver();
            }
        }

        // Renderização
        function render() {
            // Limpar tela
            ctx.fillStyle = '#2d5a27';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            
            // Desenhar chão (grade sutil)
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            ctx.lineWidth = 1;
            const gridSize = 100;
            const range = 1000;
            for (let x = -range; x <= range; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x - player.x, -range - player.y);
                ctx.lineTo(x - player.x, range - player.y);
                ctx.stroke();
            }
            for (let y = -range; y <= range; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(-range - player.x, y - player.y);
                ctx.lineTo(range - player.x, y - player.y);
                ctx.stroke();
            }
            
            // Desenhar sombras das árvores primeiro
            trees.forEach(tree => {
                const screenX = tree.x - player.x;
                const screenY = tree.y - player.y;
                
                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.beginPath();
                ctx.ellipse(
                    screenX + tree.shadowOffset,
                    screenY + tree.shadowOffset,
                    tree.radius * 0.8,
                    tree.radius * 0.6,
                    Math.PI / 4,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
            });
            
            // Desenhar kits médicos
            medkits.forEach(medkit => {
                const screenX = medkit.x - player.x;
                const screenY = medkit.y - player.y;
                
                // Retângulo branco
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(
                    screenX - medkit.width/2,
                    screenY - medkit.height/2,
                    medkit.width,
                    medkit.height
                );
                
                // Cruz vermelha
                ctx.fillStyle = '#ff0000';
                ctx.fillRect(
                    screenX - 3,
                    screenY - medkit.height/2,
                    6,
                    medkit.height
                );
                ctx.fillRect(
                    screenX - medkit.width/2,
                    screenY - 3,
                    medkit.width,
                    6
                );
            });
            
            // Desenhar árvores
            trees.forEach(tree => {
                const screenX = tree.x - player.x;
                const screenY = tree.y - player.y;
                
                // Tronco
                ctx.fillStyle = '#5c4033';
                ctx.beginPath();
                ctx.arc(screenX, screenY, tree.radius * 0.3, 0, Math.PI * 2);
                ctx.fill();
                
                // Copa da árvore (vista de cima)
                const gradient = ctx.createRadialGradient(
                    screenX, screenY, 0,
                    screenX, screenY, tree.radius
                );
                gradient.addColorStop(0, '#228b22');
                gradient.addColorStop(0.7, '#2d5a27');
                gradient.addColorStop(1, '#1a472a');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, tree.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Detalhes da copa
                ctx.strokeStyle = '#1a472a';
                ctx.lineWidth = 2;
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2;
                    ctx.beginPath();
                    ctx.moveTo(screenX, screenY);
                    ctx.lineTo(
                        screenX + Math.cos(angle) * tree.radius * 0.8,
                        screenY + Math.sin(angle) * tree.radius * 0.8
                    );
                    ctx.stroke();
                }
            });
            
            // Desenar explosões
            explosions.forEach(explosion => {
                const screenX = explosion.x - player.x;
                const screenY = explosion.y - player.y;
                
                const gradient = ctx.createRadialGradient(
                    screenX, screenY, 0,
                    screenX, screenY, explosion.radius
                );
                gradient.addColorStop(0, '#ffffff');
                gradient.addColorStop(0.3, '#ffff00');
                gradient.addColorStop(0.6, '#ff6600');
                gradient.addColorStop(1, 'rgba(255,0,0,0)');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(screenX, screenY, explosion.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Desenar granadas
            grenades.forEach(grenade => {
                const screenX = grenade.x - player.x;
                const screenY = grenade.y - player.y;
                
                ctx.fillStyle = '#333333';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 8, 0, Math.PI * 2);
                ctx.fill();
                
                // Pavio piscando
                if (grenade.fuse % 10 < 5) {
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.arc(screenX, screenY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
            
            // Desenar balas
            bullets.forEach(bullet => {
                const screenX = bullet.x - player.x;
                const screenY = bullet.y - player.y;
                
                ctx.fillStyle = bullet.isEnemy ? '#ff6600' : '#ffff00';
                ctx.beginPath();
                ctx.arc(screenX, screenY, 4, 0, Math.PI * 2);
                ctx.fill();
                
                // Rastro da bala
                ctx.strokeStyle = bullet.isEnemy ? 'rgba(255,102,0,0.5)' : 'rgba(255,255,0,0.5)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(screenX, screenY);
                ctx.lineTo(screenX - bullet.vx * 2, screenY - bullet.vy * 2);
                ctx.stroke();
            });
            
            // Desenar inimigos
            enemies.forEach(enemy => {
                const screenX = enemy.x - player.x;
                const screenY = enemy.y - player.y;
                
                // Sombra
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(
                    screenX + 5,
                    screenY + 5,
                    enemy.radius,
                    enemy.radius * 0.6,
                    0,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                // Corpo do inimigo
                ctx.fillStyle = '#8b0000';
                ctx.beginPath();
                ctx.arc(screenX, screenY, enemy.radius, 0, Math.PI * 2);
                ctx.fill();
                
                // Olhos (direção para o jogador)
                const angleToPlayer = Math.atan2(player.y - enemy.y, player.x - enemy.x);
                ctx.fillStyle = '#ffff00';
                ctx.beginPath();
                ctx.arc(
                    screenX + Math.cos(angleToPlayer - 0.3) * 10,
                    screenY + Math.sin(angleToPlayer - 0.3) * 10,
                    4,
                    0,
                    Math.PI * 2
                );
                ctx.arc(
                    screenX + Math.cos(angleToPlayer + 0.3) * 10,
                    screenY + Math.sin(angleToPlayer + 0.3) * 10,
                    4,
                    0,
                    Math.PI * 2
                );
                ctx.fill();
                
                // Barra de vida do inimigo
                const healthPercent = enemy.health / enemy.maxHealth;
                ctx.fillStyle = '#333';
                ctx.fillRect(screenX - 15, screenY - enemy.radius - 10, 30, 5);
                ctx.fillStyle = healthPercent > 0.5 ? '#00ff00' : healthPercent > 0.25 ? '#ffff00' : '#ff0000';
                ctx.fillRect(screenX - 15, screenY - enemy.radius - 10, 30 * healthPercent, 5);
            });
            
            // Desenar jogador
            // Sombra do jogador
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(
                5,
                5,
                player.radius,
                player.radius * 0.6,
                0,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Corpo do jogador
            ctx.fillStyle = '#4169e1';
            ctx.beginPath();
            ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
            ctx.fill();
            
            // Arma
            ctx.save();
            ctx.rotate(player.angle);
            ctx.fillStyle = '#333';
            ctx.fillRect(0, -5, player.weaponLength, 10);
            ctx.restore();
            
            // Cabeça do jogador (indicando direção)
            ctx.fillStyle = '#ffccaa';
            ctx.beginPath();
            ctx.arc(
                Math.cos(player.angle) * 10,
                Math.sin(player.angle) * 10,
                8,
                0,
                Math.PI * 2
            );
            ctx.fill();
            
            // Partículas
            particles.forEach(particle => {
                const screenX = particle.x - player.x;
                const screenY = particle.y - player.y;
                
                ctx.fillStyle = particle.color;
                ctx.globalAlpha = particle.life / 50;
                ctx.beginPath();
                ctx.arc(screenX, screenY, particle.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            });
            
            ctx.restore();
            
            // Mira do mouse
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(mouse.x, mouse.y, 10, 0, Math.PI * 2);
            ctx.moveTo(mouse.x - 20, mouse.y);
            ctx.lineTo(mouse.x + 20, mouse.y);
            ctx.moveTo(mouse.x, mouse.y - 20);
            ctx.lineTo(mouse.x, mouse.y + 20);
            ctx.stroke();
        }

        // Game Over
        function gameOver() {
            gameRunning = false;
            document.getElementById('menu').style.display = 'flex';
            document.querySelector('#menu h1').textContent = 'GAME OVER';
        }

        // Funções do menu
        function resumeGame() {
            document.getElementById('menu').style.display = 'none';
            gameRunning = true;
        }

        function restartGame() {
            document.getElementById('menu').style.display = 'none';
            initGame();
            gameRunning = true;
        }

        function exitGame() {
            // Em navegadores, não podemos realmente "fechar" a aba
            // Mostramos uma mensagem
            document.body.innerHTML = '<div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#000;color:white;font-size:40px;">Obrigado por jogar!<br>Você pode fechar esta aba.</div>';
        }

        // Event Listeners
        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            
            if (e.code === 'Space') {
                e.preventDefault();
                if (gameRunning) {
                    document.getElementById('menu').style.display = 'flex';
                    document.querySelector('#menu h1').textContent = 'PAUSE';
                    gameRunning = false;
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        window.addEventListener('mousedown', (e) => {
            if (!gameRunning) return;
            
            if (e.button === 0) { // Botão esquerdo
                shoot();
            } else if (e.button === 2) { // Botão direito
                throwGrenade();
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Game Loop
        function gameLoop() {
            update();
            render();
            requestAnimationFrame(gameLoop);
        }

        // Iniciar jogo
        initGame();
        gameLoop();
    </script>
</body>
</html>
